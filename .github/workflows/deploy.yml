name: 🚀 v9 部署 Pages

# 九宝量化 v9 · 静态站部署
#   纯静态（单 index.html + data/*.js），无构建步骤。
#   守卫：部署前校验 index.html 存在且 data/ 至少 5 个文件（v9 只需 6 个，<5 视为同步残缺）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署前守卫
        run: |
          set -e
          test -f index.html || { echo "🔴 缺 index.html"; exit 1; }
          N=$(ls data/*.js 2>/dev/null | wc -l | tr -d ' ')
          echo "data/*.js = $N"
          test "$N" -ge 5 || { echo "🔴 data 文件仅 $N 个（<5），疑同步残缺，拒绝部署"; exit 1; }
          echo "index.html = $(wc -c < index.html) B"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
