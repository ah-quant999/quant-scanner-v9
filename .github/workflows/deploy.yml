name: 🚀 v9 部署 Pages

# 九宝量化 v9 · 静态站部署
#   纯静态（单 index.html + data/*.js），无构建步骤。
#   守卫：部署前校验 index.html 存在且 data/ 至少 4 个文件（v9 只需 4 个，<4 视为同步残缺）。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: v9-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 部署前守卫
        run: |
          set -e
          test -f index.html || { echo "🔴 缺 index.html"; exit 1; }
          N=$(ls data/*.js 2>/dev/null | wc -l | tr -d ' ')
          echo "data/*.js = $N"
          test "$N" -ge 4 || { echo "🔴 data 文件仅 $N 个（<4），疑同步残缺，拒绝部署"; exit 1; }
          echo "index.html = $(wc -c < index.html) B"

      - uses: actions/configure-pages@v5
        with:
          # 首次运行时自动创建 Pages 站点（build_type=workflow），否则 deploy-pages 报 Get Pages site failed
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      # GitHub Pages 对同一站点有最短部署间隔（约 1 分钟）。连推两个 commit 时，
      # 第二次会撞锁报 "Deployment failed, try again later" —— 表现为一个红叉假失败，
      # 而线上其实是对的（部署的是前一次成功的产物）。等 60 秒重来一次，别让它冒充故障。
      - name: 撞 Pages 部署节流 → 等 60 秒重试
        if: steps.deployment.outcome == 'failure'
        run: |
          echo "⚠️ 首次部署失败，疑似 Pages 最短间隔节流，等待 60 秒后重试"
          sleep 60

      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
