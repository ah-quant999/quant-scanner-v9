name: 🔄 v9 数据同步 + 发布

# 九宝量化 v9 · 数据同步 + Pages 发布（一次运行做完，不依赖二次触发）
#   宗旨：① 大盘走势判断  ② 未来收益率最高的股
#   v9 只展示、不生产：数据从 v8 的 GitHub Pages 拉取（1 个 data/V8_VERDICT.js，约 30KB）。
#   🔴 2026-11-27 主人令「v9 只有一个选股页可看，v9 暂停」：大盘页已删，自动刷新停用，只留手动。
#   v8 冻结不再改代码，但其数据链继续跑；v9 借此保持独立展示。
#   观测类数据（涨停热力/板块资金/板块强度/龙虎榜/ETF…）不进 v9，留在 v8。
#
# 铁律（v8 血证）：用 GITHUB_TOKEN 提交的 push 不会触发下游 push workflow ⇒ Pages 恒旧。
#   故本 workflow 同步完就地部署，发布不依赖 deploy.yml 被再次触发。

on:
  # 🔴 2026-11-27 主人令「v9 暂停」：自动档位全部停用，只留手动触发。
  #    要恢复自动刷新，把下面 4 行 cron 的注释去掉即可（档位保持不变）。
  # schedule:
  #   - cron: '50 0 * * 1-5'    # 北京 08:50 盘前
  #   - cron: '40 3 * * 1-5'    # 北京 11:40 盘中
  #   - cron: '45 8 * * 1-5'    # 北京 16:45 盘后
  #   - cron: '45 12 * * 1-5'   # 北京 20:45 夜间
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: v9-pages
  cancel-in-progress: false

jobs:
  sync-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 拉取 v8 数据（失败保留旧文件）
        run: |
          set -u
          SRC="https://ah-quant999.github.io/quant-scanner-v8/data"
          FILES="V8_VERDICT"
          OK=0; FAIL=0
          for f in $FILES; do
            TMP="data/$f.js.tmp"
            if curl -fsS --retry 3 --retry-delay 2 --max-time 45 \
                 -H 'Cache-Control: no-cache' -o "$TMP" "$SRC/$f.js?cb=$(date +%s)"; then
              SZ=$(wc -c < "$TMP" | tr -d ' ')
              if [ "$SZ" -gt 200 ] && head -c 2000 "$TMP" | grep -q 'window\.'; then
                mv "$TMP" "data/$f.js"; OK=$((OK+1)); echo "  ✅ $f  ${SZ}B"
              else
                rm -f "$TMP"; FAIL=$((FAIL+1)); echo "  ⚠️ $f 校验不过（${SZ}B 或无 window.），保留旧文件"
              fi
            else
              rm -f "$TMP"; FAIL=$((FAIL+1)); echo "  ⚠️ $f 拉取失败，保留旧文件"
            fi
          done
          echo "── 成功 $OK / 失败 $FAIL ──"
          if [ "$OK" -eq 0 ]; then echo "🔴 全部失败，中止（不产生空提交、不发布）"; exit 1; fi

      - name: 统计并提交
        run: |
          set -e
          NEW=$(git status --porcelain data/ | wc -l | tr -d ' ')
          echo "变更文件数：$NEW"
          ls -la data/
          if [ "$NEW" -eq 0 ]; then echo "⏭️ 数据无变更（仍重新发布一次，防止 Pages 落后于代码）"; exit 0; fi
          git config user.name  "v9-sync-bot"
          git config user.email "v9-sync-bot@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): v9 同步 v8 数据 $(date -u -d '+8 hours' '+%Y-%m-%d %H:%M') 北京时间"
          git push

      - name: 发布前守卫
        run: |
          set -e
          test -f index.html || { echo "🔴 缺 index.html"; exit 1; }
          N=$(ls data/*.js 2>/dev/null | wc -l | tr -d ' ')
          echo "data/*.js = $N ；index.html = $(wc -c < index.html) B"
          test "$N" -ge 1 || { echo "🔴 data 文件仅 $N 个（<1），疑同步残缺，拒绝发布"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
