<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>九宝量化 v9 · 大盘 + 选股</title>
<!--
  九宝量化 v9 · 唯一宗旨（铁律 P0 ⓪，2026-11-27 主人令）
    ① 判断大盘走势   ② 选出未来收益率最高的股
  本站只做这两件事。任何卡片必须先回答「服务 ① 还是 ②」，答不上来不进本站。

  页面只有两个（2026-11-27 主人令）：
    📊 大盘 = 现在大盘什么情况（指数 / 主力资金 / 平均股价）
    🎯 选股 = 买不买 · 买多少 · 买哪几只：综合研判 / 今日可买(3 只) / 别碰 / 主线 / 仓位纪律
  其余观测类视图（涨停热力、板块资金榜、板块强度榜、龙虎榜、ETF、热力图…）一律留在 v8，不进 v9。

  与 v8 的关系：v8 冻结不再改动；v9 是精简重建，只保留宗旨必需的数据与视图。
  数据同步：.github/workflows/sync_data.yml 从 v8 Pages 拉取 4 个 data/*.js。
  铁律：数据一律 window.X 注入，禁止 fetch('../data/...')。
-->
<style>
:root{
  --bg:#0d1117; --panel:#151b23; --panel2:#1b222c; --border:#243040;
  --txt:#e6edf3; --sub:#9aa7b8; --dim:#6b7a8d;
  --up:#ef5350; --down:#26a69a; --gold:#ffd024; --blue:#41c9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;padding-bottom:40px}
a{color:var(--blue);text-decoration:none}

header{position:sticky;top:0;z-index:20;background:rgba(13,17,23,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.hd{max-width:1280px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-size:17px;font-weight:700;letter-spacing:.3px}
.brand span{color:var(--gold)}
.hdmeta{font-size:12px;color:var(--dim);margin-left:auto}
.tabs{max-width:1280px;margin:0 auto;padding:0 18px;display:flex;gap:8px}
.tab{padding:9px 18px;border-radius:8px 8px 0 0;cursor:pointer;font-size:14px;font-weight:600;color:var(--sub);border:1px solid transparent;border-bottom:none;user-select:none}
.tab:hover{color:var(--txt);background:var(--panel2)}
.tab.active{color:var(--gold);background:var(--panel);border-color:var(--border)}

main{max-width:1280px;margin:0 auto;padding:16px 18px}
section{display:none}
section.active{display:block}

.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c12{grid-column:span 12}
.c8{grid-column:span 8}.c7{grid-column:span 7}.c5{grid-column:span 5}
@media(max-width:900px){.c6,.c4,.c8,.c7,.c5{grid-column:span 12}}

.ch{display:flex;align-items:baseline;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border)}
.ch h3{font-size:14px;font-weight:700}
.ch .tag{font-size:11px;color:var(--dim)}
.ch .ts{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap}
.cb{padding:14px}

.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--sub)}
.num{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}.sub{color:var(--sub)}
.gold{color:var(--gold)}

table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:right;font-weight:600;color:var(--dim);font-size:11.5px;padding:6px 8px;border-bottom:1px solid var(--border)}
th:first-child,td:first-child{text-align:left}
td{padding:7px 8px;border-bottom:1px solid rgba(36,48,64,.5)}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--panel2)}

.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media(max-width:760px){.idx{grid-template-columns:repeat(2,1fr)}}
.idxbox{background:var(--panel2);border-radius:8px;padding:12px}
.idxbox .nm{font-size:12px;color:var(--sub)}
.idxbox .px{font-size:21px;font-weight:700;margin:4px 0;font-variant-numeric:tabular-nums}
.idxbox .cg{font-size:13px;font-weight:600}
.idxbox .ud{font-size:11px;color:var(--dim);margin-top:4px}

.kv{display:flex;flex-wrap:wrap;gap:10px}
.kvitem{background:var(--panel2);border-radius:8px;padding:9px 12px;min-width:110px;flex:1}
.kvitem .k{font-size:11px;color:var(--dim)}
.kvitem .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}

.note{font-size:12px;color:var(--dim);line-height:1.75}
.empty{padding:22px;text-align:center;color:var(--dim);font-size:13px}
.bar{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--blue)}

.pill{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600}
.pill.up{background:rgba(239,83,80,.14);color:var(--up);border:1px solid rgba(239,83,80,.32)}
.pill.down{background:rgba(38,166,154,.14);color:var(--down);border:1px solid rgba(38,166,154,.32)}
.pill.warn{background:rgba(255,208,36,.14);color:var(--gold);border:1px solid rgba(255,208,36,.32)}
.pill.mute{background:rgba(148,163,184,.12);color:var(--sub);border:1px solid rgba(148,163,184,.28)}


.act{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.act .big{font-size:27px;font-weight:800;line-height:1.1;letter-spacing:.5px}
.para{font-size:13px;line-height:1.85;padding:7px 0;border-bottom:1px dashed rgba(36,48,64,.6)}
.para .lb{display:inline-block;font-size:11px;color:var(--dim);margin-right:8px}
.para.diverge{color:var(--gold)}
.subhd{font-size:11.5px;font-weight:700;color:var(--dim);letter-spacing:.5px;margin:12px 0 5px}
.evirow{display:flex;gap:10px;font-size:12.5px;line-height:1.7;padding:3px 0}
.evik{flex:0 0 66px;color:var(--sub);font-weight:600}
.eviv{flex:0 0 60px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.evip{flex:1;color:var(--dim);font-size:11.5px}
.warnbar{background:rgba(255,208,36,.1);border:1px solid rgba(255,208,36,.3);color:var(--gold);
  border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:10px;line-height:1.7}
.whytxt{font-size:11px;color:var(--gold);margin-top:3px}
.why2{font-size:11px;color:var(--dim);margin-top:2px}
.lanerow{display:flex;align-items:baseline;gap:8px;font-size:13px;padding:5px 0;
  border-bottom:1px dashed rgba(36,48,64,.5);flex-wrap:wrap}
.lanenum{margin-left:auto;font-size:11.5px;color:var(--sub);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0 8px}
.chip{font-size:11.5px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:3px 8px}
.chkrow{display:flex;gap:8px;font-size:12.5px;padding:3px 0;line-height:1.6}
.chkrow .mk{flex:0 0 16px}
.chkrow .cn{flex:0 0 90px;color:var(--txt)}
.chkrow .cw{flex:1;color:var(--dim);font-size:11.5px}
.chkrow.no .cn{color:var(--sub)}
details{margin-top:8px}
summary{cursor:pointer;font-size:12.5px;color:var(--sub);padding:6px 0;user-select:none}
summary:hover{color:var(--txt)}

.stockrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(36,48,64,.5)}
.stockrow:last-child{border-bottom:none}
.rk{width:22px;height:22px;border-radius:5px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--sub);flex:0 0 auto}
.rk.top{background:rgba(255,208,36,.16);color:var(--gold)}
.snm{font-weight:600;font-size:13.5px}
.scd{font-size:11px;color:var(--dim);margin-left:6px}
.srt{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums}
.srt .sc{font-size:14px;font-weight:700}
.srt .pc{font-size:11px;color:var(--dim)}

</style>
</head>
<body>

<header>
  <div class="hd">
    <div class="brand">九宝量化 <span>v9</span></div>
    <div class="hdmeta" id="hdMeta">数据加载中…</div>
  </div>
  <div class="tabs">
    <div class="tab active" data-sec="mkt">📊 大盘</div>
    <div class="tab" data-sec="pick">🎯 选股</div>
  </div>
</header>

<main>
<!-- ═══════════════ ① 大盘走势判断 ═══════════════ -->
<section id="sec-mkt" class="active">
  <div class="grid">

    <div class="card c12">
      <div class="ch"><h3>指数快览</h3><span class="tag">服务 ① · 大盘位置</span><span class="ts" id="ts-idx">—</span></div>
      <div class="cb"><div class="idx" id="idxBox"><div class="empty">加载中…</div></div></div>
    </div>

    <div class="card c6">
      <div class="ch"><h3>大盘资金</h3><span class="tag">主力净额</span><span class="ts" id="ts-mff">—</span></div>
      <div class="cb" id="mffBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card c6">
      <div class="ch"><h3>平均股价</h3><span class="tag">全市场位置</span><span class="ts" id="ts-avg">—</span></div>
      <div class="cb" id="avgBox"><div class="empty">加载中…</div></div>
    </div>

  </div>
</section>

<!-- ═══════════ ② 买不买 · 买多少 · 买哪几只（只给 3 只） ═══════════ -->
<section id="sec-pick">
  <div class="grid">

    <div class="card c12">
      <div class="ch"><h3>综合研判</h3><span class="tag" id="vdTag">判断买不买 · 买多少</span><span class="ts" id="ts-vd">—</span></div>
      <div class="cb" id="vdBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card c7">
      <div class="ch"><h3>今日可买</h3><span class="tag" id="stkTag">最有把握的 3 只</span><span class="ts" id="ts-stk">—</span></div>
      <div class="cb" id="stkBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card c5">
      <div class="ch"><h3>别碰</h3><span class="tag">涨着却在流出 / 净流出</span></div>
      <div class="cb" id="avoidBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card c7">
      <div class="ch"><h3>主线 · 哪些能进</h3><span class="tag">钱在等进 / 今日接力</span></div>
      <div class="cb" id="mainBox"><div class="empty">加载中…</div></div>
    </div>

    <div class="card c5">
      <div class="ch"><h3>仓位纪律</h3><span class="tag" id="disTag">加仓检查表</span></div>
      <div class="cb" id="disBox"><div class="empty">加载中…</div></div>
    </div>

  </div>
</section>
</main>

<!-- ═══════════ 数据注入（defer，同步 workflow 维护） ═══════════ -->
<script src="data/INDEX_QUOTES.js" defer></script>
<script src="data/MARKET_FUND_FLOW_DATA.js" defer></script>
<script src="data/AVG_PRICE_DATA.js" defer></script>
<script src="data/V8_VERDICT.js" defer></script>

<script>
/* ══════════════════════════════════════════════════════════════
   九宝量化 v9 渲染层
   原则：① 大盘 3 卡 / ② 选股 5 卡，八卡（2026-11-27 主人令：观测类留 v8，选股只给 3 只）。
   降级铁律（继承 v8 血证）：
     · 任何数据缺失 ⇒ 明示「未到位」，绝不用陈旧数据冒充当日。
     · 研判 buy.mode=none ⇒ 个股清单只作观察名单，绝不标成买入指令。
   ══════════════════════════════════════════════════════════════ */
(function(){
'use strict';

var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function num(v){ var n=Number(v); return isFinite(n)?n:null; }
function fmt(v,d){ var n=num(v); return n==null?'—':n.toFixed(d==null?2:d); }
function sgn(v,d){ var n=num(v); if(n==null) return '—'; return (n>0?'+':'')+n.toFixed(d==null?2:d); }
function cls(v){ var n=num(v); if(n==null) return 'flat'; return n>0?'up':(n<0?'down':'flat'); }
function ts(s){ return s? String(s).replace('T',' ').slice(0,16) : '—'; }

/* 陈旧度标注：盘后数据 T-1 正常；T-2 灰（周末）；>=3 天金色告警，绝不用陈旧冒充当日 */
function dayDiff(d){
  var m = String(d||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return null;
  var t = Date.UTC(+m[1], +m[2]-1, +m[3]);
  var n = new Date();
  var now = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
  return Math.round((now - t) / 864e5);
}
function markTs(el, v){
  if(!el) return;
  var n = dayDiff(v);
  var base = esc(ts(v));
  if(n == null || n <= 0){ el.innerHTML = base; return; }
  if(n >= 3) el.innerHTML = base + ' <b class="gold">· 陈旧 '+n+' 天</b>';
  else       el.innerHTML = base + ' <span class="dim">· T-'+n+'</span>';
}

/* ── 页签切换（记忆上次位置） ── */
var tabs = document.querySelectorAll('.tab');
function switchTo(sec){
  for(var i=0;i<tabs.length;i++) tabs[i].classList.toggle('active', tabs[i].dataset.sec===sec);
  document.querySelectorAll('main section').forEach(function(s){ s.classList.toggle('active', s.id==='sec-'+sec); });
  try{ localStorage.setItem('v9_sec', sec); }catch(e){}
  window.scrollTo(0,0);
}
tabs.forEach(function(t){ t.addEventListener('click', function(){ switchTo(t.dataset.sec); }); });

/* ══════════════ ① 大盘 ══════════════ */

function renderIndex(){
  var D = window.INDEX_QUOTES || {};
  var items = D.items || [];
  var box = $('idxBox');
  if(!items.length){ box.innerHTML='<div class="empty">指数数据未到位（data/INDEX_QUOTES.js）</div>'; return; }
  markTs($('ts-idx'), D.update_time);
  var h='';
  items.slice(0,4).forEach(function(x){
    var c = cls(x.change);
    h += '<div class="idxbox">'
      +  '<div class="nm">'+esc(x.name||x.short)+'</div>'
      +  '<div class="px '+c+' num">'+fmt(x.price)+'</div>'
      +  '<div class="cg '+c+' num">'+sgn(x.change)+' ('+sgn(x.chg)+'%)</div>'
      +  '<div class="ud">涨 '+(x.up==null?'—':x.up)+' · 跌 '+(x.down==null?'—':x.down)+'</div>'
      +  '</div>';
  });
  box.innerHTML = h;
}

function renderMff(){
  var D = window.MARKET_FUND_FLOW_DATA || {};
  var box = $('mffBox');
  var daily = D.daily || [];
  if(!daily.length){ box.innerHTML='<div class="empty">资金数据未到位</div>'; return; }
  var d = daily[daily.length-1];
  markTs($('ts-mff'), d.date ? String(d.date).replace(/^(\d{4})(\d{2})(\d{2})$/,'$1-$2-$3') : D.update_time);
  var net = num(d.net_yi);
  var h = '<div class="kv">'
    + '<div class="kvitem"><div class="k">主力净额</div><div class="v '+cls(net)+'">'+sgn(net)+' 亿</div></div>'
    + '<div class="kvitem"><div class="k">超大单</div><div class="v '+cls(d.super_large_yi)+'">'+sgn(d.super_large_yi)+' 亿</div></div>'
    + '<div class="kvitem"><div class="k">大单</div><div class="v '+cls(d.large_yi)+'">'+sgn(d.large_yi)+' 亿</div></div>'
    + '<div class="kvitem"><div class="k">小单</div><div class="v '+cls(d.small_yi)+'">'+sgn(d.small_yi)+' 亿</div></div>'
    + '</div>';
  h += '<div class="note" style="margin-top:10px">主力净额 = 超大单 + 大单。<b class="'+cls(net)+'">'
     + (net==null?'—':(net>0?'资金净流入':'资金净流出'))
     + '</b>，小单方向往往相反（散户对手盘）。</div>';
  box.innerHTML = h;
}

function renderAvg(){
  var D = window.AVG_PRICE_DATA || {};
  var box = $('avgBox');
  if(D.avg_price==null){ box.innerHTML='<div class="empty">平均股价未到位</div>'; return; }
  markTs($('ts-avg'), D.date);
  var pos = num(D.position_vs_ma20);
  var h = '<div class="kv">'
    + '<div class="kvitem"><div class="k">平均股价</div><div class="v num">'+fmt(D.avg_price,2)+'</div></div>'
    + '<div class="kvitem"><div class="k">当日涨跌</div><div class="v '+cls(D.avg_change_pct)+'">'+sgn(D.avg_change_pct)+'%</div></div>'
    + '</div>';
  h += '<div class="note" style="margin-top:10px">MA20 '+fmt(D.ma20,2)
    + ' · 距 MA20 <b class="'+cls(pos)+'">'+sgn(pos)+'%</b>'
    + (pos==null?'':(pos<0?'（在均线下方，弱势）':'（在均线上方，强势）'))+'</div>';
  box.innerHTML = h;
}

/* ══════════════ ② 买不买 · 买多少 · 买哪几只 ══════════════ */

var V = function(){ return window.V8_VERDICT || {}; };

/* 数据里带 **不加仓** 这类粗体标记，转成 <b> 后再输出 */
function md(t){
  return esc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
}

/* ── 综合研判：动作 / 大盘定性 / 所以 / 怎么做 / 理由 ── */
function renderVerdict(){
  var D = V(), box = $('vdBox');
  if(!D.head && !D.buy){ box.innerHTML = '<div class="empty">研判未到位（data/V8_VERDICT.js）</div>'; return; }
  markTs($('ts-vd'), D.update_time);

  var head = D.head || {}, buy = D.buy || {}, pos = D.position || {}, plain = D.plain || {};
  var add = (D.triggers || {}).add || {};
  var hit = num(add.hit) || 0, total = num(add.total) || 0, need = num(add.need) || 0;

  var noBuy = (String(buy.mode) === 'none') || !(num(buy.factor) > 0);
  var act = noBuy ? '不买' : (buy.mode_txt || '可动手');
  var actCls = String(head.stance) === 'attack' ? 'up' : (String(head.stance) === 'defense' ? 'down' : 'gold');

  var h = '<div class="act">'
    + '<div class="big ' + actCls + '">' + esc(act) + '</div>'
    + '<span class="pill mute">' + esc(head.icon || '') + ' ' + esc(head.label || '—') + '</span>'
    + '<span class="pill mute">仓位上限 ' + (pos.cap_pct == null ? '—' : esc(pos.cap_pct) + '%') + '</span>'
    + '<span class="pill ' + (total > 0 && hit >= need ? 'up' : 'warn') + '">加仓条件 ' + hit + '/' + total + '</span>'
    + '</div>';

  if(buy.answer) h += '<div class="note" style="font-size:13px;color:var(--txt);margin-bottom:8px">' + md(buy.answer) + '</div>';
  if(plain['读今天']) h += '<div class="para"><span class="lb">大盘定性</span>' + md(plain['读今天']) + '</div>';
  if(plain['所以'])   h += '<div class="para"><span class="lb">所以</span>' + md(plain['所以']) + '</div>';
  if(plain['怎么做']) h += '<div class="para"><span class="lb">怎么做</span>' + md(plain['怎么做']) + '</div>';
  if(pos.diverge)     h += '<div class="para diverge"><span class="lb">分歧点</span>' + md(pos.diverge) + '</div>';

  var ev = D.evidence || [];
  if(ev.length){
    h += '<div class="subhd">理由（' + ev.length + ' 条信号）</div>';
    ev.forEach(function(e){
      var v = String(e.value == null ? '' : e.value);
      var vc = /[:：]/.test(v) ? 'gold' : (/fail/i.test(v) ? 'gold' : cls(num(v)));
      h += '<div class="evirow"><span class="evik">' + esc(e.name) + '</span>'
        +  '<span class="eviv ' + vc + '">' + esc(v) + '</span>'
        +  '<span class="evip">' + md(e.plain) + '</span></div>';
    });
  }

  var alpha = D.alpha || {}, tail = '';
  if(alpha.verdict) tail += '<div>策略超额（样本外）：<b class="' + (/fail/i.test(alpha.verdict) ? 'gold' : 'up') + '">'
    + esc(alpha.verdict) + '</b>' + (alpha.ir_oos == null ? '' : ' · IR ' + esc(alpha.ir_oos)) + '</div>';
  if(D.caveat) tail += '<div style="margin-top:6px">' + md(D.caveat) + '</div>';
  if(tail) h += '<details><summary>护栏与局限（必读）</summary><div class="note" style="margin-top:6px">' + tail + '</div></details>';

  if(D.list_check && D.list_check.met === false){
    h += '<div class="note" style="margin-top:8px;color:var(--gold)">榜单闸门未过：' + esc(D.list_check.why || '') + '</div>';
  }
  box.innerHTML = h;
}

/* ── 今日可买：最多 3 只，逐只列理由 ── */
function renderStocks(){
  var D = V(), box = $('stkBox'), tag = $('stkTag');
  markTs($('ts-stk'), D.update_time);
  var buy = D.buy || {}, arr = buy.stocks || [], siz = D.sizing || {};
  var noBuy = (String(buy.mode) === 'none') || !(num(buy.factor) > 0);

  if(!arr.length){
    tag.innerHTML = '<span class="pill warn">今日 0 只</span>';
    box.innerHTML = '<div class="empty">今日因子榜没有个股入池 —— 不硬凑，空仓也是一种仓位</div>';
    return;
  }

  var can = 0;
  arr.forEach(function(x){ if(x.buyable) can++; });
  tag.innerHTML = noBuy
    ? '<span class="pill warn">可买 0 只 · 下列只观察</span>'
    : '<span class="pill up">可买 ' + can + ' / ' + arr.length + ' 只</span>';

  var h = '';
  if(noBuy) h += '<div class="warnbar">今天可买额度 <b>0%</b> —— 下面 ' + arr.length + ' 只只是观察名单，<b>不是买入指令</b>。</div>';

  arr.forEach(function(x, i){
    h += '<div class="stockrow">'
      +  '<div class="rk ' + (i === 0 ? 'top' : '') + '">' + (x.rank || i + 1) + '</div>'
      +  '<div style="flex:1;min-width:0">'
      +    '<div class="snm">' + esc(x.name) + '<span class="scd">' + esc(x.code) + '</span>'
      +      (x.buyable ? '<span class="pill up" style="margin-left:8px">可买</span>'
                       : '<span class="pill mute" style="margin-left:8px">等企稳</span>') + '</div>'
      +    '<div class="scd">' + esc(x.industry || '—') + '</div>'
      +    '<div class="whytxt">' + esc(x.why || '') + '</div>'
      +  '</div>'
      +  '<div class="srt">'
      +    '<div class="sc num">' + fmt(x.close) + '</div>'
      +    '<div class="pc ' + cls(x.chg) + '">' + sgn(x.chg) + '%</div>'
      +    '<div class="pc">止 ' + fmt(x.stop) + ' / 目 ' + fmt(x.target) + '</div>'
      +    '<div class="pc">盈亏比 ' + fmt(x.rr, 2) + '</div>'
      +  '</div></div>';
  });

  if(siz.rule) h += '<div class="note" style="margin-top:10px;border-top:1px dashed var(--border);padding-top:8px">仓位口径：' + md(siz.rule) + '</div>';
  box.innerHTML = h;
}

/* ── 别碰 ── */
function renderAvoid(){
  var D = V(), box = $('avoidBox');
  var arr = D.avoid || [];
  if(!arr.length){ box.innerHTML = '<div class="empty">今日无明确禁区</div>'; return; }
  var h = '<table><thead><tr><th>板块</th><th>当日</th><th>资金</th></tr></thead><tbody>';
  arr.forEach(function(x){
    h += '<tr><td>' + esc(x.name) + '<div class="why2">' + esc(x.why || '') + '</div></td>'
      +  '<td class="' + cls(x.chg) + ' num" style="text-align:right">' + sgn(x.chg) + '%</td>'
      +  '<td class="' + cls(x.net) + ' num" style="text-align:right">' + sgn(x.net) + ' 亿</td></tr>';
  });
  h += '</tbody></table>';
  if(D.avoid_note) h += '<div class="note" style="margin-top:10px">' + md(D.avoid_note) + '</div>';
  box.innerHTML = h;
}

/* ── 主线：L1 钱在等进 / L2 今日接力 ── */
function renderMain(){
  var D = V(), box = $('mainBox'), buy = D.buy || {};
  var secs = buy.sectors || [], chase = buy.chase || [];
  if(!secs.length && !chase.length){ box.innerHTML = '<div class="empty">主线数据未到位</div>'; return; }
  var h = '';
  if(secs.length){
    h += '<div class="subhd">L1 钱在等进（连续净流入，还没成型标的）</div>';
    secs.forEach(function(x){
      h += '<div class="lanerow"><b>' + esc(x.name) + '</b>'
        +  '<span class="dim" style="font-size:11px">' + esc(x.type || '') + '</span>'
        +  '<span class="lanenum">今 ' + sgn(x.net_today) + ' 亿 · 5日 ' + sgn(x.net_5d) + ' 亿 · 连 ' + esc(x.days) + ' 天</span></div>';
    });
  }
  if(chase.length){
    h += '<div class="subhd" style="margin-top:12px">L2 今日接力（涨停最集中 · 追高区，等回调不追）</div>';
    chase.forEach(function(x){
      h += '<div class="lanerow"><b>' + esc(x.name) + '</b>'
        +  '<span class="lanenum">今日涨停 ' + esc(x.today) + ' 家 · 5日 ' + esc(x.sum5) + ' 家</span></div><div class="chips">';
      (x.leaders || []).forEach(function(l){
        h += '<span class="chip">' + esc(l.name) + ' <b class="' + cls(l.chg) + '">' + sgn(l.chg) + '%</b></span>';
      });
      h += '</div>';
    });
  }
  box.innerHTML = h;
}

/* ── 仓位纪律：单票/首批/最多几只/止损 + 加仓检查表 + 降档条件 ── */
function renderDisc(){
  var D = V(), box = $('disBox'), tag = $('disTag');
  var siz = D.sizing || {}, trg = D.triggers || {}, add = trg.add || {};
  var items = add.items || [], need = num(add.need) || 0;
  var hit = num(add.hit) || 0, total = num(add.total) || 0;

  tag.innerHTML = '<span class="pill ' + (need && hit >= need ? 'up' : 'warn') + '">加仓 ' + hit + '/' + total
    + (need ? '（需 ' + esc(need) + '）' : '') + '</span>';

  var capPct = num((D.position || {}).cap_pct), maxPos = num(siz.max_positions);
  var base = (capPct != null && maxPos) ? capPct / maxPos : null;   /* 满档单票 */
  var h = '<div class="kv">'
    +  '<div class="kvitem"><div class="k">单票（满档 / 今日）</div><div class="v num">'
    +    (base == null ? '—' : fmt(base, 1) + '%')
    +    ' <span style="font-size:12px;color:var(--gold)">/ ' + fmt(siz.per_stock_pct, 1) + '%</span></div></div>'
    +  '<div class="kvitem"><div class="k">首批（今日）</div><div class="v num">' + fmt(siz.first_batch_pct, 1) + '%</div></div>'
    +  '<div class="kvitem"><div class="k">最多持股</div><div class="v num">' + (maxPos == null ? '—' : esc(maxPos) + ' 只') + '</div></div>'
    +  '<div class="kvitem"><div class="k">单票止损</div><div class="v down num">' + (siz.stop_loss_pct == null ? '—' : esc(siz.stop_loss_pct) + '%') + '</div></div>'
    +  '</div>';

  if(items.length){
    h += '<div class="subhd">加仓检查表（凑够 ' + (need || '—') + ' 条才加）</div>';
    items.forEach(function(i){
      h += '<div class="chkrow ' + (i.met ? 'ok' : 'no') + '"><span class="mk">' + (i.met ? '✅' : '❌') + '</span>'
        +  '<span class="cn">' + esc(i.name || '') + '</span>'
        +  '<span class="cw">' + esc(i.now || '') + '</span></div>';
    });
  }

  var cut = trg.cut || {}, citems = cut.items || [];
  if(citems.length){
    h += '<div class="subhd" style="margin-top:12px">立刻降档（' + esc(cut.rule || '') + '）</div><div class="note">';
    citems.forEach(function(c){ h += '· ' + esc(c.cond || '') + ' ⇒ <b>' + esc(c.act || '') + '</b><br>'; });
    h += '</div>';
  }
  if((trg.exit || {}).rule) h += '<div class="note" style="margin-top:8px">回撤纪律：' + esc(trg.exit.rule) + '</div>';
  box.innerHTML = h;
}

/* ══════════════ 主渲染 + 自愈轮询 ══════════════ */
var RENDERS = [
  ['IDX', renderIndex], ['MFF', renderMff], ['AVG', renderAvg],
  ['VD', renderVerdict], ['STK', renderStocks], ['AVD', renderAvoid],
  ['MAIN', renderMain], ['DISC', renderDisc]
];

function renderAll(){
  RENDERS.forEach(function(r){ try{ r[1](); }catch(e){ console.warn('[v9]', r[0], e); } });
  var D = window.V8_VERDICT || {};
  $('hdMeta').textContent = D.update_time
    ? ('研判 ' + ts(D.update_time) + ' · ' + ((D.head || {}).label || ''))
    : '数据加载中…';
}

function boot(){
  var s=null; try{ s=localStorage.getItem('v9_sec'); }catch(e){}
  if(s && document.getElementById('sec-'+s)) switchTo(s);
  renderAll();
  /* 自愈：defer 脚本可能晚于首次渲染，600ms×20 内补渲 */
  var n=0, timer=setInterval(function(){
    n++;
    var any = (window.INDEX_QUOTES||window.V8_VERDICT);
    if(any){ clearInterval(timer); renderAll(); }
    else if(n>20){ clearInterval(timer); }
  }, 600);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

/* 暴露给外部调试 */
window.v9 = { renderAll: renderAll, switchTo: switchTo };
})();
</script>
</body>
</html>
